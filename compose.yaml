services:
  portainer:
    image: portainer/portainer-ce:2.43.0

    command:
      - -H
      - tcp://tasks.agent:9001
      - --tlsskipverify

    volumes:
      - portainer_data:/data

    networks:
      - traefik-network
      - portainer-network

    deploy:
      mode: replicated

      replicas: 1

      placement:
        constraints:
          - node.role == manager

      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-network

        # Router
        - traefik.http.routers.portainer.rule=Host(`portainer.homelab.local`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.tls=true
        - traefik.http.routers.portainer.service=portainer

        # Service
        - traefik.http.services.portainer.loadbalancer.server.port=9000

  agent:
    image: portainer/agent:2.43.0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

    networks:
      - portainer-network

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.platform.os == linux

networks:
  traefik-network:
    external: true

  portainer-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.10.10.0/24

volumes:
  portainer_data:
